version: 2
models:
  - name: "stg_model"
    description: "Returns the id, name, host_id, updated timestamp, and created
      timestamp for each listing from raw_listings."
    config:
      materialized: "table"
      unique_key: []
    tests: []
    columns:
      - name: "id"
        type: "NUMBER"
        description: "Unique identifier for the listing."
        tests:
          - not_null_tolerance:
              tolerance: 5
      - name: "host_id"
        type: "NUMBER"
        description: "Unique identifier for the host who owns the listing."
        tests:
          - not_null_tolerance:
              tolerance: 0
          - range_tolerance:
              min: 0
              max: 100
              tolerance: 0
      - name: "name"
        type: "TEXT"
        description: "Name or title of the listing."
        tests:
          - not_null_tolerance:
              tolerance: 0
      - name: "updated_at"
        type: "TIMESTAMP"
        tests: []
      - name: "created_at"
        type: "TIMESTAMP"
        tests: []
    meta:
      model_tags:
        - "2fabd4fa-2810-468e-9a28-ec7b7f28ebb4"
      incremental_config:
        target_column: ""
        incremental_origins: []
      updated: "2025-08-24T12:57:39.968Z"
