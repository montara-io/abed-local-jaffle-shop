version: 2
models:
  - name: "new_model"
    description: "Retrieves the id and created_at columns from the raw_listings
      table, renaming them as ID and CREATED_AT, limited to 10 records."
    config:
      materialized: "table"
      unique_key: []
    tests: []
    columns:
      - name: "id"
        type: "NUMBER"
        description: "Unique identifier for each listing record."
        tests:
          - range_tolerance:
              min: 0
              max: 100
              tolerance: 0
      - name: "created_at"
        type: "TIMESTAMP"
        description: "Timestamp indicating when the listing was created."
        tests:
          - date_range_tolerance:
              range_type: "Between"
              after: "2025-8-11"
              before: "2025-8-20"
              tolerance: 0
    meta:
      model_tags:
        - "19f67624-f880-4afc-8e8a-d12a61077b49"
      incremental_config:
        target_column: ""
        incremental_origins: []
      updated: "2025-08-19T12:41:49.811Z"
